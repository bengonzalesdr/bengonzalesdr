name: refresh contribution signal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution signal
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#24292f&color_dots=#ebedf0,#9ea4aa,#747a81,#4f555c,#24292f
            dist/github-snake-dark.svg?color_snake=#e6edf3&color_dots=#0d1117,#21262d,#30363d,#6e7681,#c9d1d9

      - name: Publish output branch
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: refresh contribution signal"
          git branch -M output
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin output
