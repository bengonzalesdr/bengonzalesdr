<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Home lab</title>
  <desc id="desc">A centered Kitty terminal window summarizing a BeeLink home lab with Proxmox, Docker, Linux virtual machines, networking, and self-hosting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080808"/><stop offset="1" stop-color="#111111"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/></filter>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="80" y="30" width="1040" height="240" rx="18" fill="#101010" stroke="#3b3b3b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="30" width="1040" height="44" rx="18" fill="#181818"/><rect x="80" y="54" width="1040" height="20" fill="#181818"/>
  <circle cx="106" cy="52" r="5.5" fill="#666"/><circle cx="126" cy="52" r="5.5" fill="#8c8c8c"/><circle cx="146" cy="52" r="5.5" fill="#bdbdbd"/>
  <text x="600" y="58" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" fill="#929292">kitty — ben@lab:~/homelab</text>

  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace">
    <text x="118" y="112" font-size="17" fill="#c8c8c8">ben@lab ~/homelab $</text>
    <text x="345" y="112" font-size="17" fill="#ededed">systemctl status homelab</text>
    <text x="118" y="153" font-size="26" font-weight="700" fill="#f4f4f4">~/homelab</text>
    <text x="286" y="153" font-size="16" fill="#8d8d8d">Where infrastructure stops being magic.</text>

    <circle cx="126" cy="191" r="5" fill="#9d9d9d"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="144" y="197" font-size="16" fill="#ededed" font-weight="700">active</text>
    <text x="220" y="197" font-size="15" fill="#838383">BeeLink mini PC · Linux · virtualization · networking · self-hosting</text>
  </g>

  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" font-weight="700">
    <rect x="176" y="218" width="180" height="38" rx="10" fill="#202020" stroke="#e57000"/><text x="266" y="243" text-anchor="middle" fill="#ededed">Proxmox</text>
    <rect x="370" y="218" width="170" height="38" rx="10" fill="#202020" stroke="#2496ed"/><text x="455" y="243" text-anchor="middle" fill="#ededed">Docker</text>
    <rect x="554" y="218" width="170" height="38" rx="10" fill="#202020" stroke="#fcc624"/><text x="639" y="243" text-anchor="middle" fill="#ededed">Linux VMs</text>
    <rect x="738" y="218" width="286" height="38" rx="10" fill="#202020" stroke="#6f6f6f"/><text x="881" y="243" text-anchor="middle" fill="#ededed">TCP/IP · DNS · DHCP</text>
  </g>
</svg>