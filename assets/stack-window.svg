<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Development stack</title>
  <desc id="desc">A centered Kitty terminal window showing Benjamin Gonzales' primary languages and technologies with colored skill buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080808"/><stop offset="1" stop-color="#111111"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/></filter>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect x="80" y="34" width="1040" height="262" rx="18" fill="#101010" stroke="#3b3b3b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="34" width="1040" height="44" rx="18" fill="#181818"/><rect x="80" y="58" width="1040" height="20" fill="#181818"/>
  <circle cx="106" cy="56" r="5.5" fill="#666"/><circle cx="126" cy="56" r="5.5" fill="#8c8c8c"/><circle cx="146" cy="56" r="5.5" fill="#bdbdbd"/>
  <text x="600" y="62" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" fill="#929292">kitty — ben@arch:~/stack</text>

  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace">
    <text x="118" y="116" font-size="17" fill="#c8c8c8">ben@arch ~/stack $</text>
    <text x="322" y="116" font-size="17" fill="#ededed">ls --skills</text>
    <text x="118" y="157" font-size="26" font-weight="700" fill="#f4f4f4">~/stack</text>
    <text x="260" y="157" font-size="16" fill="#8d8d8d">Java first. Web every day. Rust next.</text>
  </g>

  <!-- row 1 -->
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="15" font-weight="700">
    <rect x="118" y="186" width="132" height="42" rx="10" fill="#242424" stroke="#b07219"/><rect x="128" y="196" width="22" height="22" rx="5" fill="#b07219"/><text x="139" y="212" text-anchor="middle" fill="#fff">J</text><text x="163" y="213" fill="#f0f0f0">Java</text>
    <rect x="262" y="186" width="132" height="42" rx="10" fill="#242424" stroke="#e34f26"/><rect x="272" y="196" width="22" height="22" rx="5" fill="#e34f26"/><text x="283" y="212" text-anchor="middle" fill="#fff">5</text><text x="307" y="213" fill="#f0f0f0">HTML</text>
    <rect x="406" y="186" width="132" height="42" rx="10" fill="#242424" stroke="#1572b6"/><rect x="416" y="196" width="22" height="22" rx="5" fill="#1572b6"/><text x="427" y="212" text-anchor="middle" fill="#fff">C</text><text x="451" y="213" fill="#f0f0f0">CSS</text>
    <rect x="550" y="186" width="132" height="42" rx="10" fill="#242424" stroke="#f7df1e"/><rect x="560" y="196" width="22" height="22" rx="5" fill="#f7df1e"/><text x="571" y="212" text-anchor="middle" fill="#111">JS</text><text x="595" y="213" fill="#f0f0f0">JS</text>
    <rect x="694" y="186" width="132" height="42" rx="10" fill="#242424" stroke="#777bb4"/><rect x="704" y="196" width="22" height="22" rx="5" fill="#777bb4"/><text x="715" y="212" text-anchor="middle" fill="#fff">P</text><text x="739" y="213" fill="#f0f0f0">PHP</text>
    <rect x="838" y="186" width="146" height="42" rx="10" fill="#242424" stroke="#3776ab"/><rect x="848" y="196" width="22" height="22" rx="5" fill="#3776ab"/><text x="859" y="212" text-anchor="middle" fill="#fff">Py</text><text x="883" y="213" fill="#f0f0f0">Python</text>
  </g>

  <!-- row 2 -->
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" font-weight="700">
    <rect x="235" y="242" width="140" height="38" rx="10" fill="#202020" stroke="#4eaa25"/><text x="305" y="267" text-anchor="middle" fill="#ededed">Bash</text>
    <rect x="389" y="242" width="158" height="38" rx="10" fill="#202020" stroke="#512bd4"/><text x="468" y="267" text-anchor="middle" fill="#ededed">C# / .NET</text>
    <rect x="561" y="242" width="140" height="38" rx="10" fill="#202020" stroke="#4479a1"/><text x="631" y="267" text-anchor="middle" fill="#ededed">MySQL</text>
    <rect x="715" y="242" width="158" height="38" rx="10" fill="#202020" stroke="#dea584"><animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></rect><text x="794" y="267" text-anchor="middle" fill="#ededed">Rust · learning</text>
  </g>
</svg>