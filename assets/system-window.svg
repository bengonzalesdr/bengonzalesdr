<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Arch and Hyprland environment</title>
  <desc id="desc">A centered Kitty terminal window summarizing the Arch Linux, Omarchy, Hyprland, Wayland, and Kitty environment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090909"/><stop offset="1" stop-color="#121212"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.62"/></filter>
  </defs>
  <rect width="1200" height="270" rx="20" fill="url(#bg)"/>
  <rect x="80" y="30" width="1040" height="210" rx="18" fill="#101010" stroke="#3b3b3b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="30" width="1040" height="44" rx="18" fill="#181818"/><rect x="80" y="54" width="1040" height="20" fill="#181818"/>
  <circle cx="106" cy="52" r="5.5" fill="#666"/><circle cx="126" cy="52" r="5.5" fill="#8c8c8c"/><circle cx="146" cy="52" r="5.5" fill="#bdbdbd"/>
  <text x="600" y="58" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" fill="#929292">kitty — ben@arch:~/.config/hypr</text>

  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace">
    <text x="118" y="112" font-size="17" fill="#c8c8c8">ben@arch ~/.config/hypr $</text>
    <text x="395" y="112" font-size="17" fill="#ededed">hyprctl systeminfo</text>
    <text x="118" y="153" font-size="26" font-weight="700" fill="#f4f4f4">~/.config/hypr</text>
    <text x="342" y="153" font-size="16" fill="#8d8d8d">Arch underneath. Everything else tuned to taste.</text>
  </g>

  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" font-weight="700">
    <rect x="118" y="176" width="188" height="42" rx="10" fill="#202020" stroke="#1793d1"/><rect x="130" y="186" width="22" height="22" rx="5" fill="#1793d1"/><text x="141" y="202" text-anchor="middle" fill="#fff">A</text><text x="166" y="203" fill="#ededed">Arch Linux</text>
    <rect x="320" y="176" width="210" height="42" rx="10" fill="#202020" stroke="#58e1ff"/><rect x="332" y="186" width="22" height="22" rx="5" fill="#58e1ff"/><text x="343" y="202" text-anchor="middle" fill="#111">H</text><text x="368" y="203" fill="#ededed">Hyprland</text>
    <rect x="544" y="176" width="202" height="42" rx="10" fill="#202020" stroke="#ffbc00"/><rect x="556" y="186" width="22" height="22" rx="5" fill="#ffbc00"/><text x="567" y="202" text-anchor="middle" fill="#111">W</text><text x="592" y="203" fill="#ededed">Wayland</text>
    <rect x="760" y="176" width="172" height="42" rx="10" fill="#202020" stroke="#6eaae4"/><rect x="772" y="186" width="22" height="22" rx="5" fill="#6eaae4"/><text x="783" y="202" text-anchor="middle" fill="#fff">K</text><text x="808" y="203" fill="#ededed">Kitty</text>
    <rect x="946" y="176" width="126" height="42" rx="10" fill="#202020" stroke="#8a8a8a"/><text x="1009" y="203" text-anchor="middle" fill="#ededed">Bash</text>
  </g>
</svg>