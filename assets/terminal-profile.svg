<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Gonzales — Arch Linux / Hyprland profile</title>
  <desc id="desc">A grayscale Hyprland-inspired desktop with a Waybar and floating Kitty terminal presenting Benjamin Gonzales, his software stack, and homelab interests.</desc>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.55" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.62"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- wallpaper -->
  <rect width="1200" height="690" rx="22" fill="url(#wall)"/>
  <rect width="1200" height="690" rx="22" fill="url(#grid)"/>
  <path d="M0 520 C220 430 330 650 560 530 S920 390 1200 535" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
  <path d="M0 565 C260 470 420 690 650 555 S980 445 1200 575" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- waybar -->
  <rect x="20" y="18" width="1160" height="42" rx="13" fill="#0d0d0d" stroke="#2b2b2b"/>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="34" y="28" width="38" height="22" rx="7" fill="#eeeeee"/>
    <text x="53" y="43" text-anchor="middle" fill="#090909" font-weight="700">1</text>
    <rect x="78" y="28" width="38" height="22" rx="7" fill="#1b1b1b"/>
    <text x="97" y="43" text-anchor="middle" fill="#8d8d8d">2</text>
    <rect x="122" y="28" width="38" height="22" rx="7" fill="#1b1b1b"/>
    <text x="141" y="43" text-anchor="middle" fill="#8d8d8d">3</text>
    <rect x="166" y="28" width="38" height="22" rx="7" fill="#1b1b1b"/>
    <text x="185" y="43" text-anchor="middle" fill="#8d8d8d">4</text>
    <rect x="210" y="28" width="38" height="22" rx="7" fill="#1b1b1b"/>
    <text x="229" y="43" text-anchor="middle" fill="#8d8d8d">5</text>

    <text x="600" y="44" text-anchor="middle" fill="#d6d6d6" font-weight="600">  ben@arch  ·  hyprland</text>

    <rect x="933" y="28" width="73" height="22" rx="7" fill="#171717"/>
    <text x="969" y="43" text-anchor="middle" fill="#aaaaaa">WAYLAND</text>
    <rect x="1012" y="28" width="64" height="22" rx="7" fill="#171717"/>
    <text x="1044" y="43" text-anchor="middle" fill="#aaaaaa">NET ●</text>
    <rect x="1082" y="28" width="84" height="22" rx="7" fill="#171717"/>
    <text x="1124" y="43" text-anchor="middle" fill="#aaaaaa">GITHUB</text>
  </g>

  <!-- floating terminal -->
  <rect x="76" y="96" width="1048" height="528" rx="18" fill="url(#terminal)" stroke="#444444" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- terminal header -->
  <rect x="76" y="96" width="1048" height="42" rx="18" fill="#171717"/>
  <rect x="76" y="120" width="1048" height="18" fill="#171717"/>
  <circle cx="99" cy="117" r="5" fill="#666666"/>
  <circle cx="117" cy="117" r="5" fill="#888888"/>
  <circle cx="135" cy="117" r="5" fill="#bcbcbc"/>
  <text x="600" y="122" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#888888">kitty — ben@arch:~</text>

  <!-- split line -->
  <line x1="784" y1="158" x2="784" y2="590" stroke="#2d2d2d"/>

  <!-- left pane: fastfetch -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="108" y="177" font-size="15" fill="#bcbcbc">ben@arch</text>
    <text x="181" y="177" font-size="15" fill="#707070">:</text>
    <text x="193" y="177" font-size="15" fill="#e8e8e8">~</text>
    <text x="210" y="177" font-size="15" fill="#bcbcbc">$ fastfetch --profile github</text>

    <!-- arch-ish mark -->
    <g fill="#dcdcdc" font-size="14">
      <text x="120" y="225">               /\</text>
      <text x="120" y="244">              /  \</text>
      <text x="120" y="263">             /\   \</text>
      <text x="120" y="282">            /      \</text>
      <text x="120" y="301">           /   ,,   \</text>
      <text x="120" y="320">          /   |  |  -\</text>
      <text x="120" y="339">         /_-''    ''-_\</text>
    </g>

    <text x="340" y="220" font-size="23" font-weight="700" fill="#f2f2f2">Benjamin Gonzales</text>
    <text x="340" y="248" font-size="14" fill="#8b8b8b">Web Engineer · Software Developer</text>

    <text x="340" y="292" font-size="14" fill="#777777">OS</text>
    <text x="430" y="292" font-size="14" fill="#d5d5d5">Arch Linux / Omarchy</text>

    <text x="340" y="320" font-size="14" fill="#777777">WM</text>
    <text x="430" y="320" font-size="14" fill="#d5d5d5">Hyprland · Wayland</text>

    <text x="340" y="348" font-size="14" fill="#777777">MAIN</text>
    <text x="430" y="348" font-size="14" fill="#f0f0f0" font-weight="700">Java</text>

    <text x="340" y="376" font-size="14" fill="#777777">WEB</text>
    <text x="430" y="376" font-size="14" fill="#d5d5d5">HTML · CSS · JS · PHP</text>

    <text x="340" y="404" font-size="14" fill="#777777">SCRIPT</text>
    <text x="430" y="404" font-size="14" fill="#d5d5d5">Python · Bash</text>

    <text x="340" y="432" font-size="14" fill="#777777">ALSO</text>
    <text x="430" y="432" font-size="14" fill="#d5d5d5">C# / .NET</text>

    <text x="340" y="460" font-size="14" fill="#777777">NEXT</text>
    <text x="430" y="460" font-size="14" fill="#f0f0f0">Rust</text>

    <text x="108" y="525" font-size="15" fill="#bcbcbc">ben@arch</text>
    <text x="181" y="525" font-size="15" fill="#707070">:</text>
    <text x="193" y="525" font-size="15" fill="#e8e8e8">~</text>
    <text x="210" y="525" font-size="15" fill="#bcbcbc">$ echo $SHELL</text>
    <text x="108" y="553" font-size="15" fill="#8b8b8b">/bin/bash  # until I inevitably tweak it again</text>
  </g>

  <!-- right pane: homelab -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="814" y="177" font-size="15" fill="#bcbcbc">ben@lab</text>
    <text x="875" y="177" font-size="15" fill="#707070">:</text>
    <text x="887" y="177" font-size="15" fill="#e8e8e8">~</text>
    <text x="904" y="177" font-size="15" fill="#bcbcbc">$ labctl status</text>

    <text x="814" y="222" font-size="14" fill="#efefef" font-weight="700">● homelab</text>
    <text x="814" y="249" font-size="13" fill="#777777">STATE</text>
    <text x="902" y="249" font-size="13" fill="#d8d8d8">active</text>

    <text x="814" y="282" font-size="13" fill="#777777">NODE</text>
    <text x="902" y="282" font-size="13" fill="#d8d8d8">BeeLink mini PC</text>

    <text x="814" y="315" font-size="13" fill="#777777">FOCUS</text>
    <text x="902" y="315" font-size="13" fill="#d8d8d8">Linux</text>
    <text x="902" y="337" font-size="13" fill="#d8d8d8">virtualization</text>
    <text x="902" y="359" font-size="13" fill="#d8d8d8">containers</text>
    <text x="902" y="381" font-size="13" fill="#d8d8d8">networking</text>
    <text x="902" y="403" font-size="13" fill="#d8d8d8">self-hosting</text>

    <text x="814" y="452" font-size="13" fill="#777777">UPTIME</text>
    <text x="902" y="452" font-size="13" fill="#d8d8d8">always learning</text>

    <text x="814" y="505" font-size="13" fill="#666666">build → break → learn</text>
    <text x="814" y="527" font-size="13" fill="#666666">→ rebuild better</text>
  </g>

  <!-- prompt + blinking cursor -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="108" y="588" fill="#bcbcbc">ben@arch</text>
    <text x="175" y="588" fill="#707070">:</text>
    <text x="187" y="588" fill="#e8e8e8">~</text>
    <text x="204" y="588" fill="#bcbcbc">$</text>
    <rect x="220" y="575" width="8" height="15" fill="#ededed">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- subtle footer -->
  <text x="600" y="662" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#444444">ARCH // WAYLAND // GITHUB PROFILE SESSION</text>
</svg>