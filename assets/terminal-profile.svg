<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Gonzales — Arch Linux / Hyprland profile</title>
  <desc id="desc">A grayscale Hyprland-inspired desktop with Waybar and a floating Kitty terminal showing Benjamin Gonzales' software stack and homelab.</desc>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.52" stop-color="#101010"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.68"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#fff" stroke-opacity="0.018" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- desktop -->
  <rect width="1200" height="620" rx="22" fill="url(#wall)"/>
  <rect width="1200" height="620" rx="22" fill="url(#grid)"/>
  <path d="M0 474 C230 394 385 578 610 476 S950 367 1200 478" fill="none" stroke="#fff" stroke-opacity="0.026" stroke-width="2"/>
  <path d="M0 520 C250 430 430 610 675 507 S990 414 1200 518" fill="none" stroke="#fff" stroke-opacity="0.018"/>

  <!-- waybar -->
  <rect x="20" y="18" width="1160" height="42" rx="13" fill="#0b0b0b" stroke="#2d2d2d"/>
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <rect x="34" y="28" width="64" height="22" rx="7" fill="#efefef"/>
    <text x="66" y="43" text-anchor="middle" fill="#090909" font-weight="700">1 dev</text>
    <rect x="104" y="28" width="68" height="22" rx="7" fill="#191919"/>
    <text x="138" y="43" text-anchor="middle" fill="#8c8c8c">2 java</text>
    <rect x="178" y="28" width="62" height="22" rx="7" fill="#191919"/>
    <text x="209" y="43" text-anchor="middle" fill="#8c8c8c">3 lab</text>
    <rect x="246" y="28" width="68" height="22" rx="7" fill="#191919"/>
    <text x="280" y="43" text-anchor="middle" fill="#8c8c8c">4 rust</text>

    <text x="600" y="43" text-anchor="middle" fill="#d6d6d6" font-weight="600">ben@arch  ·  hyprland</text>

    <rect x="946" y="28" width="72" height="22" rx="7" fill="#171717"/>
    <text x="982" y="43" text-anchor="middle" fill="#a0a0a0">WAYLAND</text>
    <rect x="1024" y="28" width="58" height="22" rx="7" fill="#171717"/>
    <text x="1053" y="43" text-anchor="middle" fill="#a0a0a0">NET</text>
    <rect x="1088" y="28" width="78" height="22" rx="7" fill="#171717"/>
    <text x="1127" y="43" text-anchor="middle" fill="#a0a0a0">GITHUB</text>
  </g>

  <!-- kitty terminal -->
  <rect x="70" y="88" width="1060" height="468" rx="18" fill="url(#term)" stroke="#414141" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="88" width="1060" height="42" rx="18" fill="#171717"/>
  <rect x="70" y="112" width="1060" height="18" fill="#171717"/>
  <circle cx="94" cy="109" r="5" fill="#666"/>
  <circle cx="112" cy="109" r="5" fill="#8b8b8b"/>
  <circle cx="130" cy="109" r="5" fill="#bdbdbd"/>
  <text x="600" y="114" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#858585">kitty — ben@arch:~ — 120x34</text>

  <line x1="770" y1="151" x2="770" y2="525" stroke="#2d2d2d"/>

  <!-- left pane -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="102" y="170" font-size="14" fill="#bcbcbc">ben@arch</text>
    <text x="172" y="170" font-size="14" fill="#6f6f6f">:</text>
    <text x="184" y="170" font-size="14" fill="#e6e6e6">~</text>
    <text x="202" y="170" font-size="14" fill="#bcbcbc">$ fastfetch --profile github</text>

    <text x="102" y="215" font-size="26" font-weight="700" fill="#f2f2f2">Benjamin Gonzales</text>
    <text x="102" y="242" font-size="14" fill="#8c8c8c">Web Engineer · Software Developer · Linux enthusiast</text>

    <text x="102" y="287" font-size="13" fill="#757575">OS</text>
    <text x="220" y="287" font-size="13" fill="#d7d7d7">Arch Linux</text>
    <text x="410" y="287" font-size="12" fill="#777">Omarchy base, re-opinionated</text>

    <text x="102" y="315" font-size="13" fill="#757575">COMPOSITOR</text>
    <text x="220" y="315" font-size="13" fill="#d7d7d7">Hyprland / Wayland</text>

    <text x="102" y="343" font-size="13" fill="#757575">TERMINAL</text>
    <text x="220" y="343" font-size="13" fill="#d7d7d7">Kitty</text>

    <text x="102" y="371" font-size="13" fill="#757575">MAIN</text>
    <text x="220" y="371" font-size="13" fill="#f0f0f0" font-weight="700">Java</text>

    <text x="102" y="399" font-size="13" fill="#757575">WEB</text>
    <text x="220" y="399" font-size="13" fill="#d7d7d7">HTML · CSS · JavaScript · PHP</text>

    <text x="102" y="427" font-size="13" fill="#757575">SCRIPTING</text>
    <text x="220" y="427" font-size="13" fill="#d7d7d7">Python · Bash</text>

    <text x="102" y="455" font-size="13" fill="#757575">ALSO</text>
    <text x="220" y="455" font-size="13" fill="#d7d7d7">C# / .NET · MySQL</text>

    <text x="102" y="483" font-size="13" fill="#757575">LEARNING</text>
    <text x="220" y="483" font-size="13" fill="#f0f0f0">Rust</text>
  </g>

  <!-- right pane -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="800" y="170" font-size="14" fill="#bcbcbc">ben@lab</text>
    <text x="862" y="170" font-size="14" fill="#6f6f6f">:</text>
    <text x="874" y="170" font-size="14" fill="#e6e6e6">~</text>
    <text x="892" y="170" font-size="14" fill="#bcbcbc">$ systemctl status homelab</text>

    <text x="800" y="214" font-size="14" fill="#efefef" font-weight="700">● homelab.service</text>
    <text x="800" y="243" font-size="12" fill="#707070">STATE</text>
    <text x="892" y="243" font-size="12" fill="#d8d8d8">active</text>

    <text x="800" y="274" font-size="12" fill="#707070">NODE</text>
    <text x="892" y="274" font-size="12" fill="#d8d8d8">BeeLink mini PC</text>

    <text x="800" y="305" font-size="12" fill="#707070">STACK</text>
    <text x="892" y="305" font-size="12" fill="#d8d8d8">Linux</text>
    <text x="892" y="327" font-size="12" fill="#d8d8d8">Proxmox</text>
    <text x="892" y="349" font-size="12" fill="#d8d8d8">Docker</text>
    <text x="892" y="371" font-size="12" fill="#d8d8d8">virtual machines</text>

    <text x="800" y="408" font-size="12" fill="#707070">NETWORK</text>
    <text x="892" y="408" font-size="12" fill="#d8d8d8">TCP/IP · DNS · DHCP</text>

    <text x="800" y="447" font-size="12" fill="#707070">STATUS</text>
    <text x="892" y="447" font-size="12" fill="#d8d8d8">always learning</text>

    <text x="800" y="492" font-size="12" fill="#5f5f5f">build → break → understand</text>
    <text x="800" y="513" font-size="12" fill="#5f5f5f">→ rebuild better</text>
  </g>

  <!-- prompt -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="102" y="528" fill="#bcbcbc">ben@arch</text>
    <text x="167" y="528" fill="#707070">:</text>
    <text x="179" y="528" fill="#e8e8e8">~</text>
    <text x="196" y="528" fill="#bcbcbc">$</text>
    <rect x="212" y="516" width="8" height="14" fill="#ededed">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="592" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#3f3f3f">ARCH · HYPRLAND · WAYLAND · GITHUB SESSION</text>
</svg>