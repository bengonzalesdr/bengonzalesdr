<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Gonzales — Arch Linux / Hyprland profile</title>
  <desc id="desc">A grayscale Hyprland-inspired desktop with Waybar and a floating Kitty terminal showing Benjamin Gonzales' development stack and homelab.</desc>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.55" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.72"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#fff" stroke-opacity="0.016" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" rx="22" fill="url(#wall)"/>
  <rect width="1200" height="620" rx="22" fill="url(#grid)"/>
  <path d="M0 478 C230 400 390 578 610 480 S950 370 1200 482" fill="none" stroke="#fff" stroke-opacity="0.024" stroke-width="2"/>

  <!-- waybar -->
  <rect x="20" y="18" width="1160" height="44" rx="13" fill="#0b0b0b" stroke="#2c2c2c"/>
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="34" y="28" width="66" height="24" rx="7" fill="#efefef"/>
    <text x="67" y="45" text-anchor="middle" fill="#080808" font-weight="700">1 dev</text>
    <rect x="106" y="28" width="70" height="24" rx="7" fill="#191919"/>
    <text x="141" y="45" text-anchor="middle" fill="#8d8d8d">2 java</text>
    <rect x="182" y="28" width="64" height="24" rx="7" fill="#191919"/>
    <text x="214" y="45" text-anchor="middle" fill="#8d8d8d">3 lab</text>
    <rect x="252" y="28" width="70" height="24" rx="7" fill="#191919"/>
    <text x="287" y="45" text-anchor="middle" fill="#8d8d8d">4 rust</text>

    <text x="600" y="45" text-anchor="middle" fill="#dedede" font-weight="700">ben@arch · hyprland</text>

    <rect x="936" y="28" width="80" height="24" rx="7" fill="#171717"/>
    <text x="976" y="45" text-anchor="middle" fill="#aaaaaa">WAYLAND</text>
    <rect x="1022" y="28" width="60" height="24" rx="7" fill="#171717"/>
    <text x="1052" y="45" text-anchor="middle" fill="#aaaaaa">NET</text>
    <rect x="1088" y="28" width="78" height="24" rx="7" fill="#171717"/>
    <text x="1127" y="45" text-anchor="middle" fill="#aaaaaa">GITHUB</text>
  </g>

  <!-- kitty -->
  <rect x="60" y="88" width="1080" height="472" rx="18" fill="url(#term)" stroke="#414141" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="88" width="1080" height="44" rx="18" fill="#171717"/>
  <rect x="60" y="112" width="1080" height="20" fill="#171717"/>
  <circle cx="86" cy="110" r="5.5" fill="#666"/>
  <circle cx="106" cy="110" r="5.5" fill="#8b8b8b"/>
  <circle cx="126" cy="110" r="5.5" fill="#bdbdbd"/>
  <text x="600" y="116" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8d8d8d">kitty — ben@arch:~ — 128×34</text>

  <line x1="768" y1="154" x2="768" y2="526" stroke="#2d2d2d"/>

  <!-- left pane -->
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="94" y="174" font-size="16" fill="#c3c3c3">ben@arch</text>
    <text x="176" y="174" font-size="16" fill="#707070">:</text>
    <text x="190" y="174" font-size="16" fill="#ececec">~</text>
    <text x="210" y="174" font-size="16" fill="#c3c3c3">$ fastfetch --profile github</text>

    <text x="94" y="224" font-size="30" font-weight="700" fill="#f4f4f4">Benjamin Gonzales</text>
    <text x="94" y="254" font-size="16" fill="#969696">Web Engineer · Software Developer · Linux enthusiast</text>

    <text x="94" y="304" font-size="15" fill="#767676">OS</text>
    <text x="236" y="304" font-size="16" fill="#e0e0e0">Arch Linux</text>
    <text x="386" y="304" font-size="14" fill="#777">Omarchy base · re-opinionated</text>

    <text x="94" y="338" font-size="15" fill="#767676">DESKTOP</text>
    <text x="236" y="338" font-size="16" fill="#e0e0e0">Hyprland · Wayland · Kitty</text>

    <text x="94" y="372" font-size="15" fill="#767676">PRIMARY</text>
    <text x="236" y="372" font-size="16" fill="#f2f2f2" font-weight="700">Java</text>

    <text x="94" y="406" font-size="15" fill="#767676">WEB</text>
    <text x="236" y="406" font-size="16" fill="#e0e0e0">HTML · CSS · JavaScript · PHP</text>

    <text x="94" y="440" font-size="15" fill="#767676">TOOLS</text>
    <text x="236" y="440" font-size="16" fill="#e0e0e0">Python · Bash · C#/.NET · MySQL</text>

    <text x="94" y="474" font-size="15" fill="#767676">LEARNING</text>
    <text x="236" y="474" font-size="16" fill="#f2f2f2">Rust</text>

    <text x="94" y="522" font-size="16" fill="#c3c3c3">ben@arch</text>
    <text x="176" y="522" font-size="16" fill="#707070">:</text>
    <text x="190" y="522" font-size="16" fill="#ececec">~</text>
    <text x="210" y="522" font-size="16" fill="#c3c3c3">$</text>
    <rect x="229" y="508" width="9" height="17" fill="#ededed">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right pane -->
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="800" y="174" font-size="16" fill="#c3c3c3">ben@lab</text>
    <text x="872" y="174" font-size="16" fill="#707070">:</text>
    <text x="886" y="174" font-size="16" fill="#ececec">~</text>
    <text x="906" y="174" font-size="16" fill="#c3c3c3">$ systemctl status homelab</text>

    <text x="800" y="224" font-size="16" fill="#f1f1f1" font-weight="700">● homelab.service</text>

    <text x="800" y="266" font-size="14" fill="#737373">STATE</text>
    <text x="912" y="266" font-size="16" fill="#e1e1e1" font-weight="700">active</text>

    <text x="800" y="306" font-size="14" fill="#737373">NODE</text>
    <text x="912" y="306" font-size="16" fill="#e1e1e1">BeeLink mini PC</text>

    <text x="800" y="346" font-size="14" fill="#737373">STACK</text>
    <text x="912" y="346" font-size="16" fill="#e1e1e1">Proxmox · Docker</text>
    <text x="912" y="372" font-size="16" fill="#e1e1e1">Linux virtual machines</text>

    <text x="800" y="414" font-size="14" fill="#737373">NETWORK</text>
    <text x="912" y="414" font-size="16" fill="#e1e1e1">TCP/IP · DNS · DHCP</text>

    <text x="800" y="466" font-size="15" fill="#777">build → break → understand</text>
    <text x="800" y="492" font-size="15" fill="#777">→ rebuild better</text>
  </g>

  <text x="600" y="596" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#444">ARCH · HYPRLAND · WAYLAND · GITHUB SESSION</text>
</svg>