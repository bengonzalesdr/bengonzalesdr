<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Gonzales — Arch Linux / Hyprland profile</title>
  <desc id="desc">A custom grayscale Hyprland-inspired desktop header with a centered Kitty terminal and subtle animations.</desc>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.48" stop-color="#101010"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.72"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity="0.016" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="22" fill="url(#wall)"/>
  <rect width="1200" height="430" rx="22" fill="url(#grid)"/>

  <!-- waybar -->
  <rect x="18" y="16" width="1164" height="44" rx="13" fill="#0a0a0a" stroke="#2d2d2d"/>
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="32" y="26" width="66" height="24" rx="7" fill="#eeeeee">
      <animate attributeName="fill-opacity" values="1;0.82;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="65" y="43" text-anchor="middle" fill="#080808" font-weight="700">1 dev</text>
    <rect x="104" y="26" width="70" height="24" rx="7" fill="#181818"/>
    <text x="139" y="43" text-anchor="middle" fill="#858585">2 java</text>
    <rect x="180" y="26" width="64" height="24" rx="7" fill="#181818"/>
    <text x="212" y="43" text-anchor="middle" fill="#858585">3 lab</text>
    <rect x="250" y="26" width="70" height="24" rx="7" fill="#181818"/>
    <text x="285" y="43" text-anchor="middle" fill="#858585">4 rust</text>

    <text x="600" y="43" text-anchor="middle" fill="#e4e4e4" font-weight="700">ben@arch  ·  hyprland</text>

    <rect x="936" y="26" width="80" height="24" rx="7" fill="#171717"/>
    <text x="976" y="43" text-anchor="middle" fill="#a8a8a8">WAYLAND</text>
    <rect x="1022" y="26" width="60" height="24" rx="7" fill="#171717"/>
    <text x="1052" y="43" text-anchor="middle" fill="#a8a8a8">NET</text>
    <circle cx="1070" cy="38" r="3" fill="#a8a8a8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="1088" y="26" width="78" height="24" rx="7" fill="#171717"/>
    <text x="1127" y="43" text-anchor="middle" fill="#a8a8a8">GITHUB</text>
  </g>

  <!-- centered kitty window -->
  <rect x="96" y="86" width="1008" height="292" rx="18" fill="url(#term)" stroke="#414141" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="96" y="86" width="1008" height="44" rx="18" fill="#181818"/>
  <rect x="96" y="110" width="1008" height="20" fill="#181818"/>
  <circle cx="122" cy="108" r="5.5" fill="#666"/>
  <circle cx="142" cy="108" r="5.5" fill="#8c8c8c"/>
  <circle cx="162" cy="108" r="5.5" fill="#bdbdbd"/>
  <text x="600" y="114" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#909090">kitty — ben@arch:~ — github</text>

  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="138" y="164" font-size="17" fill="#c7c7c7">ben@arch</text>
    <text x="224" y="164" font-size="17" fill="#777">:</text>
    <text x="238" y="164" font-size="17" fill="#efefef">~</text>
    <text x="260" y="164" font-size="17" fill="#c7c7c7">$ fastfetch --minimal</text>

    <text x="138" y="214" font-size="32" font-weight="700" fill="#f5f5f5">Benjamin Gonzales</text>
    <text x="138" y="246" font-size="17" fill="#9b9b9b">Web Engineer · Software Developer · Linux enthusiast</text>

    <text x="138" y="294" font-size="15" fill="#777">OS</text>
    <text x="236" y="294" font-size="17" fill="#e5e5e5">Arch Linux</text>
    <text x="394" y="294" font-size="15" fill="#747474">Omarchy base · re-opinionated</text>

    <text x="138" y="326" font-size="15" fill="#777">FOCUS</text>
    <text x="236" y="326" font-size="17" fill="#f0f0f0">Java · Web Development · Systems</text>

    <text x="676" y="294" font-size="15" fill="#777">DESKTOP</text>
    <text x="784" y="294" font-size="17" fill="#e5e5e5">Hyprland · Wayland</text>

    <text x="676" y="326" font-size="15" fill="#777">NEXT</text>
    <text x="784" y="326" font-size="17" fill="#f0f0f0">Rust</text>

    <text x="138" y="354" font-size="17" fill="#c7c7c7">ben@arch ~ $</text>
    <rect x="264" y="339" width="10" height="18" fill="#ededed">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="409" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#3f3f3f">ARCH · HYPRLAND · WAYLAND · GITHUB SESSION</text>
</svg>