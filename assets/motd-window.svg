<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Message of the day</title>
  <desc id="desc">A minimal Kitty terminal footer with a short personal message and blinking cursor.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080808"/><stop offset="1" stop-color="#111111"/></linearGradient></defs>
  <rect width="1200" height="180" rx="20" fill="url(#bg)"/>
  <rect x="80" y="24" width="1040" height="132" rx="18" fill="#101010" stroke="#3b3b3b" stroke-width="1.5"/>
  <rect x="80" y="24" width="1040" height="42" rx="18" fill="#181818"/><rect x="80" y="48" width="1040" height="18" fill="#181818"/>
  <circle cx="106" cy="45" r="5.5" fill="#666"/><circle cx="126" cy="45" r="5.5" fill="#8c8c8c"/><circle cx="146" cy="45" r="5.5" fill="#bdbdbd"/>
  <text x="600" y="51" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" fill="#929292">kitty — ben@arch:/etc/motd</text>
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace">
    <text x="118" y="98" font-size="17" fill="#c8c8c8">ben@arch /etc $</text>
    <text x="296" y="98" font-size="17" fill="#ededed">cat motd</text>
    <text x="118" y="130" font-size="17" fill="#a4a4a4">build → break → understand → rebuild better.</text>
    <text x="742" y="130" font-size="17" fill="#c8c8c8">ben@arch ~ $</text>
    <rect x="868" y="115" width="10" height="18" fill="#ededed"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/></rect>
  </g>
</svg>