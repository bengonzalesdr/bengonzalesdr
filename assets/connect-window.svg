<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Connect with Benjamin Gonzales</title>
  <desc id="desc">A custom Kitty terminal style heading for social links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080808"/><stop offset="1" stop-color="#111111"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/></filter>
  </defs>
  <rect width="1200" height="190" rx="20" fill="url(#bg)"/>
  <rect x="80" y="28" width="1040" height="134" rx="18" fill="#101010" stroke="#3b3b3b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="28" width="1040" height="44" rx="18" fill="#181818"/><rect x="80" y="52" width="1040" height="20" fill="#181818"/>
  <circle cx="106" cy="50" r="5.5" fill="#666"/><circle cx="126" cy="50" r="5.5" fill="#8c8c8c"/><circle cx="146" cy="50" r="5.5" fill="#bdbdbd"/>
  <text x="600" y="56" text-anchor="middle" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="14" fill="#929292">kitty — ben@arch:~/connect</text>
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace">
    <text x="118" y="112" font-size="29" font-weight="800" fill="#f4f4f4">🔗 Connect</text>
    <text x="118" y="143" font-size="17" fill="#a0a0a0">GitHub · LinkedIn · dot.cards</text>
    <text x="760" y="119" font-size="16" fill="#bfbfbf">ben@arch ~/connect $ open</text>
    <rect x="1014" y="104" width="9" height="18" fill="#ededed"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>