<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Gonzales</title>
  <desc id="desc">Monochrome foggy Pacific Northwest inspired developer profile header with subtle post-hardcore texture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.48" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8d8d8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#d8d8d8" stop-opacity="0.13"/>
      <stop offset="0.48" stop-color="#ededed" stop-opacity="0.19"/>
      <stop offset="0.76" stop-color="#bdbdbd" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#d8d8d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272727"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="screen"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- distant fog layers -->
  <path d="M0 132 C170 108 300 132 430 124 C560 116 666 97 790 112 C936 130 1044 104 1200 115 L1200 191 L0 191 Z" fill="#171717"/>
  <path d="M0 152 C170 131 312 159 459 143 C591 129 705 141 842 136 C991 131 1087 144 1200 135 L1200 205 L0 205 Z" fill="#202020" opacity=".58"/>

  <!-- coast / sea -->
  <rect x="0" y="199" width="1200" height="101" fill="url(#sea)"/>
  <path d="M0 233 C120 218 222 242 330 229 C438 216 553 239 654 226 C786 209 907 238 1018 223 C1082 214 1142 217 1200 225" fill="none" stroke="#4b4b4b" stroke-width="2" opacity=".65"/>
  <path d="M0 253 C137 238 231 262 359 248 C475 236 596 260 728 244 C865 229 1008 258 1200 241" fill="none" stroke="#2f2f2f" stroke-width="2" opacity=".8"/>

  <!-- sea stacks -->
  <path d="M90 242 L128 166 L158 205 L184 148 L215 216 L248 244 Z" fill="#080808"/>
  <path d="M945 247 L982 189 L1008 215 L1039 156 L1067 213 L1106 247 Z" fill="#090909"/>

  <!-- tree silhouettes -->
  <g fill="#080808" opacity=".98">
    <path d="M0 206 H61 L61 161 L78 184 L78 142 L98 177 L98 120 L123 169 L123 135 L146 180 L146 148 L171 188 L171 157 L198 194 L198 206 Z"/>
    <path d="M1200 206 H1137 L1137 162 L1119 183 L1119 140 L1098 177 L1098 118 L1071 168 L1071 135 L1048 180 L1048 148 L1023 188 L1023 157 L996 194 L996 206 Z"/>
  </g>
  <g fill="#111111" opacity=".9">
    <path d="M142 218 H203 L203 174 L220 194 L220 153 L238 186 L238 137 L261 181 L261 155 L282 193 L282 167 L305 199 L305 218 Z"/>
    <path d="M1058 218 H997 L997 174 L980 194 L980 153 L962 186 L962 137 L939 181 L939 155 L918 193 L918 167 L895 199 L895 218 Z"/>
  </g>

  <!-- fog -->
  <rect y="142" width="1200" height="77" fill="url(#fog)"/>
  <rect y="176" width="1200" height="42" fill="url(#fog)" opacity=".62"/>

  <!-- ghost typography for distressed/post-hardcore depth -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" opacity=".16">
    <text x="594" y="115" font-size="58" fill="#bdbdbd">Benjamin Gonzales</text>
    <text x="607" y="121" font-size="58" fill="#737373">Benjamin Gonzales</text>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="118" font-size="58" font-weight="700" letter-spacing="1.4" fill="#f3f3f3">Benjamin Gonzales</text>
    <text x="600" y="151" font-size="16" letter-spacing="4.2" fill="#b8b8b8">WEB ENGINEER · SOFTWARE DEVELOPER · LINUX</text>
  </g>

  <!-- subtle interference -->
  <g stroke="#bdbdbd" opacity=".12">
    <line x1="178" y1="91" x2="420" y2="91"/>
    <line x1="772" y1="174" x2="1027" y2="174"/>
    <line x1="231" y1="184" x2="514" y2="184"/>
    <line x1="694" y1="83" x2="941" y2="83"/>
  </g>
  <g fill="#8a8a8a" opacity=".22">
    <rect x="211" y="88" width="88" height="2"/>
    <rect x="848" y="171" width="104" height="2"/>
    <rect x="375" y="181" width="64" height="2"/>
  </g>

  <text x="600" y="205" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#979797">JAVA · WEB · SYSTEMS · RUST NEXT</text>

  <rect width="1200" height="300" rx="16" fill="none" stroke="#333"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#0a0a0a"/>
  <rect width="1200" height="300" rx="16" fill="transparent" filter="url(#grain)" opacity=".68"/>
</svg>