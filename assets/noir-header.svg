<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Gonzales</title>
  <desc id="desc">Monochrome developer profile banner for Benjamin Gonzales.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#111214"/>
      <stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5f5f5" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#9a9a9a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="22"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1005" cy="148" r="215" fill="url(#orb)"/>

    <path d="M795 32 C905 84 941 29 1041 74 S1152 118 1225 75" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1.2"/>
    <path d="M742 251 C865 191 943 278 1060 219 S1174 202 1230 233" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1.2"/>
    <circle cx="1010" cy="150" r="84" fill="none" stroke="#fff" stroke-opacity="0.16"/>
    <circle cx="1010" cy="150" r="58" fill="none" stroke="#fff" stroke-opacity="0.09"/>
    <circle cx="1010" cy="150" r="7" fill="#f4f4f4">
      <animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M926 150H1094M1010 66V234" stroke="#fff" stroke-opacity="0.07"/>

    <rect x="42" y="30" width="190" height="28" rx="14" fill="#f3f3f3"/>
    <text x="137" y="49" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#090909">BENGONZALESDR / DEV</text>

    <text x="48" y="118" class="mono" font-size="16" font-weight="700" fill="#8d949c" letter-spacing="2">WEB · SOFTWARE · LINUX</text>
    <text x="45" y="175" class="mono" font-size="44" font-weight="800" fill="#f6f7f8">BENJAMIN GONZALES</text>
    <text x="48" y="212" class="mono" font-size="18" fill="#b9bec5">Web Engineer  /  Software Developer  /  Linux Enthusiast</text>

    <g class="mono" font-size="13" font-weight="700">
      <rect x="48" y="242" width="104" height="30" rx="8" fill="#17191c" stroke="#3a3d42"/>
      <text x="100" y="262" text-anchor="middle" fill="#e8eaed">JAVA</text>
      <rect x="162" y="242" width="104" height="30" rx="8" fill="#17191c" stroke="#3a3d42"/>
      <text x="214" y="262" text-anchor="middle" fill="#e8eaed">ARCH</text>
      <rect x="276" y="242" width="126" height="30" rx="8" fill="#17191c" stroke="#3a3d42"/>
      <text x="339" y="262" text-anchor="middle" fill="#e8eaed">HYPRLAND</text>
      <rect x="412" y="242" width="112" height="30" rx="8" fill="#17191c" stroke="#3a3d42"/>
      <text x="468" y="262" text-anchor="middle" fill="#e8eaed">HOMELAB</text>
    </g>

    <g class="mono" font-size="12" fill="#8d949c">
      <text x="884" y="102">01 / BUILD</text>
      <text x="1050" y="102">02 / BREAK</text>
      <text x="884" y="211">03 / LEARN</text>
      <text x="1050" y="211">04 / REBUILD</text>
    </g>

    <rect x="0" y="0" width="1200" height="300" fill="none" stroke="#33363b" stroke-width="2" rx="22"/>
    <rect x="-220" y="0" width="150" height="300" fill="#fff" opacity="0.018" transform="skewX(-14)">
      <animate attributeName="x" from="-220" to="1320" dur="9s" repeatCount="indefinite"/>
    </rect>
